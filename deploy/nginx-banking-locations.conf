    # Personalization Agent Banking (named location for reliable SPA fallback)
    location /banking-platform/v1/ {
        root /var/www/html;
        try_files $uri $uri/ @banking_spa;
    }
    location @banking_spa {
        root /var/www/html;
        try_files /banking-platform/v1/index.html =404;
    }
    # ^~ = prefer this prefix (no regex check); long timeouts for Agent A execution (~3 min)
    location ^~ /banking-platform/v1/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
    }
