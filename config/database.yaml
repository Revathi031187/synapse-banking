storage:
  type: "local"  # local, postgres, delta_lake
  local:
    data_dir: "./data"
    processed_dir: "./data/processed"
    models_dir: "./models"
    cache_dir: "./cache"
  
vector_store:
  type: "chromadb"
  persist_directory: "./data/vector_store"
  collection_names:
    customers: "customer_embeddings"
    products: "product_embeddings"

cache:
  type: "memory"  # memory, redis
  ttl_seconds: 3600
  redis:
    host: "localhost"
    port: 6379
    db: 0

