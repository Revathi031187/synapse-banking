# Databricks Apps: run FastAPI on one port serving API + React frontend (same port).
# run_app.py sets working directory to repo root so data/, api/, frontend/dist resolve correctly.
#
# TOGETHER_API_KEY: Create a .env file in this repo in Databricks (same folder as run_app.py)
# with: TOGETHER_API_KEY=your_key. See deploy/DATABRICKS_ENV_FILE.md for steps.
command:
  - python
  - run_app.py

# UC Volume declaration — grants the App's service principal READ FILES on this volume.
# transactions.csv (876K rows, ~80 MB) lives here and is too large for the App bundle.
# The App reads it directly from /Volumes/dev/banking/meridian_preloaded/ at runtime.
resources:
  - name: meridian-preloaded-volume
    description: "Meridian Bank preloaded transaction data (transactions.csv)"
    uc_volume:
      catalog: dev
      schema: banking
      volume_name: meridian_preloaded
      access_type: READ
